<nav [attr.aria-label]="'Navegação da área de ' + profile().label">
  @for (group of groups(); track group) {
    <div class="mb-5 last:mb-0">
      <p class="mb-2 px-3 text-xs font-medium text-ink3">{{ group }}</p>
      <ul class="m-0 list-none space-y-1 p-0">
        @for (page of profile().pages; track page.path) {
          @if (page.group === group) {
            <li>
              <a
                [routerLink]="page.path"
                routerLinkActive="bg-sf text-pri-d font-semibold"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                class="flex min-h-11 items-center gap-3 rounded-lg px-3 py-2 text-sm text-ink2 no-underline transition-colors duration-150 hover:bg-sf hover:text-ink motion-reduce:transition-none"
                (click)="navigate.emit()"
              >
                <svg
                  class="size-[18px] shrink-0"
                  [lucideIcon]="icons[page.icon]"
                  aria-hidden="true"
                ></svg>
                {{ page.key === 'painel' ? 'Painel' : page.title }}
              </a>
            </li>
          }
        }
      </ul>
    </div>
  }
</nav>
