<section
  id="como-funciona"
  class="chapter strata-section"
  tabindex="-1"
  aria-labelledby="workflow-title"
  data-scroll-scene="strata-reveal"
>
  <div class="page-frame">
    <div class="section-intro" appReveal>
      <h2 id="workflow-title">
        <span class="motion-line"><span>Do contrato à solução.</span></span
        ><span class="motion-line"><span>Um fluxo conectado.</span></span>
      </h2>
      <p class="chapter-lead">
        Quatro etapas previstas para levar o compromisso até a comprovação.
      </p>
    </div>
    <div class="strata-stage">
      <div class="strata-layers" aria-hidden="true">
        @for (band of bands; track band) {
          <div class="strata-row">
            <span
              appScrollMotion="strata-left"
              [motionIndex]="band"
              motionTrigger=".strata-stage"
            ></span
            ><span
              appScrollMotion="strata-right"
              [motionIndex]="band"
              motionTrigger=".strata-stage"
            ></span>
          </div>
        }
      </div>
      <ol class="strata-list">
        @for (step of steps; track step.title; let i = $index) {
          <li>
            <span class="level-badge" [attr.data-tone]="i % 3">{{ labels[i] }}</span>
            <h3>{{ step.title }}</h3>
            <p>{{ step.description }}</p>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
